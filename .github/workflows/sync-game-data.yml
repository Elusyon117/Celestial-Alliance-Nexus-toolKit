name: Sync game data

on:
  workflow_dispatch:
    inputs:
      patch:
        description: Optional patch override. Leave blank to resolve the current patch for the selected channel.
        required: false
        type: string
      channel:
        description: Data channel
        required: true
        default: LIVE
        type: choice
        options:
          - LIVE
          - PTU
          - EPTU
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: game-data-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate update scripts
        run: |
          node --check scripts/resolve-live-build.mjs
          node --check scripts/verify-live-data.mjs
          node --check scripts/normalize-contract-payouts.mjs
          node --check scripts/sync-scmdb-missions.mjs
          node --check scripts/audit-patch-data.mjs

      - name: Resolve requested channel
        id: request
        shell: bash
        env:
          INPUT_PATCH: ${{ github.event.inputs.patch || '' }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel || 'LIVE' }}
        run: |
          set -euo pipefail
          channel="${INPUT_CHANNEL:-LIVE}"
          patch="${INPUT_PATCH:-}"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "patch=$patch" >> "$GITHUB_OUTPUT"

      - name: Resolve authoritative current LIVE build
        id: live
        if: steps.request.outputs.channel == 'LIVE'
        run: node scripts/resolve-live-build.mjs --write data/live-build.json --github-output

      - name: Resolve synchronization target
        id: target
        shell: bash
        env:
          REQUEST_PATCH: ${{ steps.request.outputs.patch }}
          REQUEST_CHANNEL: ${{ steps.request.outputs.channel }}
          LIVE_PATCH: ${{ steps.live.outputs.patch }}
        run: |
          set -euo pipefail
          channel="${REQUEST_CHANNEL:-LIVE}"
          patch="${REQUEST_PATCH:-}"
          if [[ "$channel" == "LIVE" && -z "$patch" ]]; then
            patch="${LIVE_PATCH:-}"
            if [[ -z "$patch" ]]; then
              echo "Unable to resolve the authoritative LIVE patch." >&2
              exit 1
            fi
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "patch=$patch" >> "$GITHUB_OUTPUT"
          echo "Target: ${patch:-newest manifest} $channel"

      - name: Synchronize SCMDB dataset
        env:
          MISSION_PATCH: ${{ steps.target.outputs.patch }}
          MISSION_CHANNEL: ${{ steps.target.outputs.channel }}
          SCMDB_BASE_URL: ${{ vars.SCMDB_BASE_URL }}
          SCMDB_VERSIONS_URL: ${{ vars.SCMDB_VERSIONS_URL }}
          SCMDB_MISSIONS_URL: ${{ vars.SCMDB_MISSIONS_URL }}
        run: node scripts/sync-scmdb-missions.mjs

      - name: Normalize Contract Finder payout fields
        run: node scripts/normalize-contract-payouts.mjs

      - name: Audit other patch-sensitive modules
        run: node scripts/audit-patch-data.mjs

      - name: Verify Contract Finder against authoritative LIVE
        if: steps.target.outputs.channel == 'LIVE'
        run: node scripts/verify-live-data.mjs --strict

      - name: Read synchronization result
        id: result
        shell: bash
        env:
          TARGET_PATCH: ${{ steps.target.outputs.patch }}
          TARGET_CHANNEL: ${{ steps.target.outputs.channel }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('data/game-data-status.json', 'utf8'));
          const audit = JSON.parse(fs.readFileSync('data/patch-audit.json', 'utf8'));
          const module = status.modules.contractFinder;
          const channel = module.channel || process.env.TARGET_CHANNEL || 'LIVE';
          const patch = module.patch || process.env.TARGET_PATCH || '';
          let contractCurrent = true;
          if (channel === 'LIVE') {
            if (!fs.existsSync('data/live-data-verification.json')) contractCurrent = false;
            else {
              const verification = JSON.parse(fs.readFileSync('data/live-data-verification.json', 'utf8'));
              contractCurrent = verification?.modules?.contractFinder?.current === true;
            }
          }
          console.log(`version=${module.gameVersion || patch || channel}`);
          console.log(`patch=${patch}`);
          console.log(`channel=${channel}`);
          console.log(`stale=${audit.staleReferenceCount}`);
          console.log(`contract_current=${contractCurrent}`);
          NODE

      - name: Commit changed snapshots and reports
        shell: bash
        run: |
          set -euo pipefail
          git add \
            data/scmdb-missions-live.json \
            data/scmdb-missions-live.js \
            data/game-data-status.json \
            data/patch-audit.json
          if [[ -f data/live-build.json && "${{ steps.target.outputs.channel }}" == "LIVE" ]]; then
            git add data/live-build.json
          fi
          if [[ -f data/live-data-verification.json && "${{ steps.target.outputs.channel }}" == "LIVE" ]]; then
            git add data/live-data-verification.json
          fi
          if git diff --cached --quiet; then
            echo "All game data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync game data for ${{ steps.result.outputs.version }}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Create or update patch-review issue
        if: steps.result.outputs.stale != '0' || (steps.result.outputs.channel == 'LIVE' && steps.result.outputs.contract_current != 'true')
        uses: actions/github-script@v8
        env:
          CURRENT_PATCH: ${{ steps.result.outputs.patch }}
          CURRENT_CHANNEL: ${{ steps.result.outputs.channel }}
          STALE_COUNT: ${{ steps.result.outputs.stale }}
          CONTRACT_CURRENT: ${{ steps.result.outputs.contract_current }}
        with:
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('data/patch-audit.json', 'utf8'));
            const target = `${process.env.CURRENT_PATCH || 'current'} ${process.env.CURRENT_CHANNEL || 'LIVE'}`;
            const title = `Patch data review required: ${target}`;
            const rows = Object.entries(audit.modules)
              .sort((a, b) => b[1].count - a[1].count)
              .map(([name, value]) => `- **${name}**: ${value.count} references (${value.patches.join(', ')})`)
              .join('\n');
            const body = [
              `Synchronization target: **${target}**.`,
              '',
              process.env.CURRENT_CHANNEL === 'LIVE'
                ? `Contract Finder matches authoritative LIVE: **${process.env.CONTRACT_CURRENT}**.`
                : 'Authoritative LIVE verification is intentionally not applied to PTU/EPTU manual runs.',
              `Patch-sensitive audit references: **${process.env.STALE_COUNT}**.`,
              '',
              rows || '- No grouped references were produced.',
              '',
              'For LIVE, the front end blocks mismatched cached/bundled datasets instead of presenting them as current.',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Report synchronization failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Game data synchronization failed';
            const body = `The scheduled/manual game-data sync failed. Existing snapshots were not intentionally overwritten. For LIVE, the web client will reject a snapshot whose patch does not match its resolved LIVE authority.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
