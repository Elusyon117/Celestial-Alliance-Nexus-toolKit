name: Sync game data

on:
  workflow_dispatch:
    inputs:
      patch:
        description: Optional patch override, such as 4.9.0. Leave blank for newest LIVE.
        required: false
        default: ''
        type: string
      channel:
        description: Game channel
        required: true
        default: LIVE
        type: choice
        options: [LIVE, PTU, EPTU]
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: sync-game-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MISSION_PATCH: ${{ github.event.inputs.patch || '' }}
      MISSION_CHANNEL: ${{ github.event.inputs.channel || 'LIVE' }}
      MIN_MISSION_COUNT: '100'
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate synchronization scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/sync-scmdb-missions.mjs
          node --check scripts/audit-patch-data.mjs
          node --check scripts/sync-pyro-hangar.mjs
          node --check scripts/validate-repo.mjs

      - name: Synchronize Pyro Executive Hangar global clock
        id: pyro_sync
        continue-on-error: true
        run: node scripts/sync-pyro-hangar.mjs

      - name: Commit Pyro Executive Hangar clock
        if: steps.pyro_sync.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pyro-hangar-sync.json

          if git diff --cached --quiet; then
            echo 'Pyro Hangar global clock is unchanged.'
          else
            git commit -m 'Sync Pyro Hangar global timer'
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo 'Pyro timer push failed after three attempts.' >&2
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - name: Synchronize mission catalog
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *'
        run: node scripts/sync-scmdb-missions.mjs

      - name: Audit generated data
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *'
        run: node scripts/audit-patch-data.mjs

      - name: Commit generated game-data files
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/scmdb-missions-live.json \
            data/scmdb-missions-live.js \
            data/game-data-status.json \
            data/patch-audit.json

          if git diff --cached --quiet; then
            echo 'No game-data changes.'
            exit 0
          fi

          git commit -m 'Sync latest game data'
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo 'Push failed after three attempts.' >&2
          exit 1

      - name: Add summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Synchronization summary'
            if [ -f data/pyro-hangar-sync.json ]; then
              jq -r '"- Pyro Hangar: `\(.status)`\n- ExecTimer source: `\(.sourceVersion // "pending")`\n- Global anchor: `\(.anchorEpochMs // "pending")`"' data/pyro-hangar-sync.json
            else
              echo '- Pyro Hangar sync file was not produced.'
            fi
            if [ -f data/game-data-status.json ]; then
              jq -r '.modules.contractFinder | "- Mission status: `\(.status)`\n- Patch: `\(.patch)`\n- Channel: `\(.channel)`\n- Missions: `\(.totalCount)`\n- Last error: `\(.lastError // "")`"' data/game-data-status.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
