name: Sync game data

on:
  workflow_dispatch:
    inputs:
      patch:
        description: Optional patch override, for example 4.10. Leave blank for newest channel build.
        required: false
        type: string
      channel:
        description: Data channel
        required: true
        default: LIVE
        type: choice
        options: [LIVE, PTU, EPTU]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: game-data-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Preflight repository
        run: |
          node --check scripts/sync-scmdb-missions.mjs
          node --check scripts/audit-patch-data.mjs
          node --check scripts/validate-toolkit.mjs
          node --check scripts/validate-repo.mjs
          node scripts/validate-repo.mjs
          node scripts/validate-toolkit.mjs --pre-sync

      - name: Fetch ScDataDumper relationship mirror
        id: scunpacked
        shell: bash
        run: |
          set -u
          target="${RUNNER_TEMP}/scunpacked-data"
          rm -rf "$target"
          if git clone --depth 1 --filter=blob:none --sparse https://github.com/StarCitizenWiki/scunpacked-data.git "$target"; then
            git -C "$target" sparse-checkout set contracts factions
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "dir=$target" >> "$GITHUB_OUTPUT"
            echo "ScDataDumper mirror ready: $(find "$target/contracts" -maxdepth 1 -type f -name '*.json' | wc -l) contract records, $(find "$target/factions" -maxdepth 1 -type f -name '*.json' | wc -l) faction records."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "dir=" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not clone StarCitizenWiki/scunpacked-data. SCMDB remains primary and the Wiki-only fallback will be attempted if needed."
          fi

      - name: Synchronize Contract Finder data
        env:
          MISSION_PATCH: ${{ github.event.inputs.patch || '' }}
          MISSION_CHANNEL: ${{ github.event.inputs.channel || 'LIVE' }}
          SCMDB_BASE_URL: ${{ vars.SCMDB_BASE_URL }}
          SCMDB_VERSIONS_URL: ${{ vars.SCMDB_VERSIONS_URL }}
          SCMDB_MISSIONS_URL: ${{ vars.SCMDB_MISSIONS_URL }}
          SCMDB_MIRROR_URLS: ${{ vars.SCMDB_MIRROR_URLS }}
          STAR_CITIZEN_WIKI_VERSIONS_URL: ${{ vars.STAR_CITIZEN_WIKI_VERSIONS_URL }}
          STAR_CITIZEN_WIKI_MISSIONS_URL: ${{ vars.STAR_CITIZEN_WIKI_MISSIONS_URL }}
          STAR_CITIZEN_WIKI_FACTIONS_URL: ${{ vars.STAR_CITIZEN_WIKI_FACTIONS_URL }}
          STAR_CITIZEN_WIKI_MISSION_FILTERS_URL: ${{ vars.STAR_CITIZEN_WIKI_MISSION_FILTERS_URL }}
          SCUNPACKED_DATA_DIR: ${{ steps.scunpacked.outputs.dir }}
          SCUNPACKED_REPO_URL: https://github.com/StarCitizenWiki/scunpacked-data
        run: node scripts/sync-scmdb-missions.mjs

      - name: Audit patch-sensitive references
        run: node scripts/audit-patch-data.mjs

      - name: Validate synchronized toolkit
        run: |
          node scripts/validate-toolkit.mjs
          node scripts/validate-repo.mjs
          node scripts/test-data-resilience.mjs

      - name: Read synchronization result
        id: result
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('data/game-data-status.json', 'utf8'));
          const module = status.modules.contractFinder || {};
          console.log(`version=${module.gameVersion || 'unknown'}`);
          console.log(`patch=${module.patch || 'unknown'}`);
          console.log(`source=${module.source || 'Unknown'}`);
          console.log(`sync_status=${module.status || 'unknown'}`);
          console.log(`total=${module.totalCount || 0}`);
          console.log(`factions=${module.factionCount || 0}`);
          console.log(`unresolved_factions=${module.unresolvedFactionCount || module.parity?.unresolvedFactionCount || 0}`);
          NODE

      - name: Commit changed snapshots and reports
        shell: bash
        run: |
          set -euo pipefail
          files=(data/scmdb-missions-live.json data/scmdb-missions-live.js data/game-data-status.json data/patch-audit.json)
          present=()
          for file in "${files[@]}"; do [[ -f "$file" ]] && present+=("$file"); done
          if [[ ${#present[@]} -eq 0 ]]; then echo "No generated data files were produced."; exit 1; fi
          git add -- "${present[@]}"
          if git diff --cached --quiet; then echo "All game data is already current."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync game data for ${{ steps.result.outputs.version }}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Contract Finder data sync"
            echo "- Version: ${{ steps.result.outputs.version || 'not produced' }}"
            echo "- Source: ${{ steps.result.outputs.source || 'not produced' }}"
            echo "- Status: ${{ steps.result.outputs.sync_status || 'failed before status write' }}"
            echo "- Contracts: ${{ steps.result.outputs.total || '0' }}"
            echo "- Named factions: ${{ steps.result.outputs.factions || '0' }}"
            echo "- Contracts without a resolved faction/issuer: ${{ steps.result.outputs.unresolved_factions || '0' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open degraded-upstream issue
        if: success() && contains(steps.result.outputs.sync_status, 'fallback')
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.result.outputs.version }}
          DATA_SOURCE: ${{ steps.result.outputs.source }}
          TOTAL: ${{ steps.result.outputs.total }}
          UNRESOLVED: ${{ steps.result.outputs.unresolved_factions }}
        with:
          script: |
            const title = 'SCMDB upstream unavailable — current Wiki fallback active';
            const body = [
              `SCMDB could not be used for **${process.env.VERSION}**.`,
              '',
              `The toolkit remained populated from **${process.env.DATA_SOURCE}** with **${process.env.TOTAL}** current mission rows and **${process.env.UNRESOLVED || 0}** rows without a resolved faction/issuer relationship.`,
              '',
              'When SCMDB returns, the next scheduled run will automatically restore exact SCMDB contracts + legacyContracts semantics and all supporting dictionaries.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find(issue => issue.title === title);
            if (existing) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });

      - name: Report synchronization failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Game data synchronization failed';
            const body = [
              'The scheduled game-data sync failed before a usable snapshot could be validated.',
              '',
              'The v2.0.5 workflow tries SCMDB first. If SCMDB is unavailable it joins the complete current-version Wiki mission catalog to StarCitizenWiki/scunpacked-data (ScDataDumper) by mission UUID for authoritative faction/issuer relationships, then validates the result before publishing.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find(issue => issue.title === title);
            if (existing) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
