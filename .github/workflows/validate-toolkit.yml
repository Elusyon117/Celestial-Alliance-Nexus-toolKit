name: Validate toolkit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-toolkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find scripts -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Validate repository and workflows
        run: node scripts/validate-repo.mjs

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nexus-validation-report
          path: docs/validation-report.json
          if-no-files-found: error
          retention-days: 14
