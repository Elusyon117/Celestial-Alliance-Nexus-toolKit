name: CA Toolkit V 2.0.3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-toolkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: |
          node --check scripts/validate-repo.mjs
          node --check scripts/validate-toolkit.mjs
          node --check scripts/test-data-resilience.mjs
          node --check scripts/sync-scmdb-missions.mjs
          node --check scripts/audit-patch-data.mjs

      - name: Validate repository invariants
        run: node scripts/validate-repo.mjs

      - name: Validate toolkit pre-sync invariants
        run: node scripts/validate-toolkit.mjs --pre-sync

      - name: Run data-resilience regression tests
        run: node scripts/test-data-resilience.mjs
