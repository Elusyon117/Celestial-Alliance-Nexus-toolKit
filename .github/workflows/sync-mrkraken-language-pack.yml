name: Sync MrKraken language pack

on:
  workflow_dispatch:
  schedule:
    - cron: '43 7 * * 1'

permissions:
  contents: write

concurrency:
  group: sync-mrkraken-language-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download and validate latest StarStrings LIVE release
        id: mirror
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TEMP_DIR="$RUNNER_TEMP/mrkraken"
          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR/extracted"

          validate_existing() {
            python3 - <<'PY'
          import json
          from pathlib import Path

          ini = Path('data/mrkraken-global.ini')
          meta_path = Path('data/mrkraken-release.json')
          if not ini.is_file() or not meta_path.is_file():
              raise SystemExit(1)
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          size = ini.stat().st_size
          entries = sum(1 for line in ini.open('r', encoding='utf-8', errors='replace') if '=' in line)
          valid = (
              entries >= 10000
              and size >= 1000000
              and int(meta.get('entry_count', -1)) == entries
              and int(meta.get('byte_count', -1)) == size
          )
          if not valid:
              raise SystemExit(1)
          print(f'Existing mirror is valid: {entries} entries, {size} bytes.')
          PY
          }

          if ! (
            set -euo pipefail
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H "Authorization: Bearer $GH_TOKEN" \
              'https://api.github.com/repos/MrKraken/StarStrings/releases/latest' \
              -o "$TEMP_DIR/release.json"

            ASSET_URL="$(jq -r '[.assets[] | select(.name == "StarStrings-LIVE.zip")][0].browser_download_url // [.assets[] | select(.name | test("LIVE.*\\.zip$";"i"))][0].browser_download_url // empty' "$TEMP_DIR/release.json")"
            ASSET_NAME="$(jq -r '[.assets[] | select(.name == "StarStrings-LIVE.zip")][0].name // [.assets[] | select(.name | test("LIVE.*\\.zip$";"i"))][0].name // empty' "$TEMP_DIR/release.json")"
            test -n "$ASSET_URL"
            test -n "$ASSET_NAME"

            curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$ASSET_URL" -o "$TEMP_DIR/$ASSET_NAME"
            unzip -q -o "$TEMP_DIR/$ASSET_NAME" -d "$TEMP_DIR/extracted"

            INI_PATH="$(find "$TEMP_DIR/extracted" -type f -ipath '*/Data/Localization/english/global.ini' -print -quit)"
            test -n "$INI_PATH"
            test -s "$INI_PATH"

            ENTRY_COUNT="$(grep -c '=' "$INI_PATH" || true)"
            BYTE_COUNT="$(wc -c < "$INI_PATH")"
            test "$ENTRY_COUNT" -ge 10000
            test "$BYTE_COUNT" -ge 1000000

            cp "$INI_PATH" data/mrkraken-global.ini
            export ENTRY_COUNT BYTE_COUNT ASSET_NAME TEMP_DIR
            python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          release = json.loads(Path(os.environ['TEMP_DIR'], 'release.json').read_text(encoding='utf-8'))
          meta = {
              'source_repository': 'MrKraken/StarStrings',
              'release_name': release.get('name') or release.get('tag_name') or '',
              'tag_name': release.get('tag_name') or '',
              'published_at': release.get('published_at') or '',
              'html_url': release.get('html_url') or '',
              'asset_name': os.environ['ASSET_NAME'],
              'entry_count': int(os.environ['ENTRY_COUNT']),
              'byte_count': int(os.environ['BYTE_COUNT']),
              'synced_at': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z')
          }
          Path('data/mrkraken-release.json').write_text(json.dumps(meta, indent=2) + '\n', encoding='utf-8')
          PY
          ); then
            echo 'The latest MrKraken release could not be downloaded or validated.' >&2
            if validate_existing; then
              echo 'preserved=true' >> "$GITHUB_OUTPUT"
              echo 'A temporary upstream failure occurred; the last verified mirror was preserved.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo 'No valid existing mirror is available.' >&2
            exit 1
          fi

          validate_existing
          echo 'preserved=false' >> "$GITHUB_OUTPUT"

      - name: Commit language mirror
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mrkraken-global.ini data/mrkraken-release.json

          if git diff --cached --quiet; then
            echo 'No language-pack changes.'
            exit 0
          fi

          git commit -m 'Sync MrKraken language pack'
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo 'Push failed after three attempts.' >&2
          exit 1

      - name: Add summary
        if: always()
        shell: bash
        run: |
          {
            echo '## MrKraken language-pack synchronization'
            if [ -f data/mrkraken-release.json ]; then
              jq -r '"- Release: `\(.release_name)`\n- Asset: `\(.asset_name)`\n- Entries: `\(.entry_count)`\n- Bytes: `\(.byte_count)`\n- Synced: `\(.synced_at)`"' data/mrkraken-release.json
            else
              echo '- Release metadata was not produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
